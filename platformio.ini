; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
boards_dir = ../sdk/boards
lib_dir = ../sdk/lib

[env:v2]
platform = espressif32 @ ^6.6.0
board = lilka_v2
framework = arduino
lib_extra_dirs = ./lib
; Define LILKA_BREADBOARD to lower SPI speed to 40 MHz (instead of normal 80)
; TODO: Remove this when we have PCBs!
; build_flags = -D LILKA_BREADBOARD -D LILKA_NO_SPLASH
build_flags = -D LILKA_NO_SPLASH
extra_scripts = move_firmware.py

; ONLY for hardware with amplifier SD isolated and independently biased.
[env:v2-modified-backlight]
extends = env:v2
build_flags = ${env:v2.build_flags} -DLILKA_INDEPENDENT_BACKLIGHT=1

; Requires the 33k/10k optocoupler charging-status hardware modification.
; SDK owns detection and automatic calibration; the application has no worker.
[env:v2-adc-charge-status]
extends = env:v2
build_flags = ${env:v2.build_flags} -DLILKA_ADC_CHARGE_STATUS=1

; Requires BOTH ADC tags and the independently wired amplifier/backlight.
[env:v2-modified-backlight-adc-charge-status]
extends = env:v2-modified-backlight
build_flags = ${env:v2-modified-backlight.build_flags} -DLILKA_ADC_CHARGE_STATUS=1
